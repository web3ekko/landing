<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Ekko protocol operations motion reel</title>
  <desc id="desc">Animated product reel showing protocol operations overview, alert creation, and routed response.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F7FF"/>
      <stop offset="100%" stop-color="#EDF2FF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="100%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F7CFF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="22" dy="22" stdDeviation="20" flood-color="#94A3B8" flood-opacity="0.18"/>
      <feDropShadow dx="-12" dy="-12" stdDeviation="16" flood-color="#FFFFFF" flood-opacity="0.92"/>
    </filter>
    <clipPath id="clipMain">
      <rect x="620" y="90" width="580" height="430" rx="34"/>
    </clipPath>
    <style>
      .eyebrow { font: 700 14px 'Manrope', Arial, sans-serif; fill: #475569; }
      .title { font: 800 58px 'Manrope', Arial, sans-serif; fill: #0F172A; letter-spacing: -2.5px; }
      .subtitle { font: 500 18px 'Manrope', Arial, sans-serif; fill: #475569; }
      .caption-label { font: 800 12px 'Manrope', Arial, sans-serif; fill: #64748B; letter-spacing: 2px; }
      .caption-text { font: 700 20px 'Manrope', Arial, sans-serif; fill: #0F172A; }
      .badge { font: 700 14px 'Manrope', Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="160" cy="110" r="220" fill="url(#glowA)"/>
  <circle cx="1140" cy="610" r="220" fill="url(#glowB)"/>
  <rect x="24" y="24" width="1232" height="672" rx="40" fill="#F9FBFF" fill-opacity="0.84" stroke="#FFFFFF" stroke-opacity="0.8" filter="url(#shadow)"/>

  <g>
    <rect x="64" y="56" width="272" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.82" stroke="#FFFFFF" stroke-opacity="0.92"/>
    <circle cx="86" cy="76" r="6" fill="url(#accent)"/>
    <text x="102" y="81" class="eyebrow">Protocol operations</text>
  </g>

  <text x="64" y="160" class="title">
    <tspan x="64" dy="0">Catch protocol risk</tspan>
    <tspan x="64" dy="60" fill="url(#accent)">before it becomes</tspan>
    <tspan x="64" dy="60" fill="url(#accent)">an incident.</tspan>
  </text>

  <text x="64" y="324" class="subtitle">
    <tspan x="64" dy="0">Help treasury and operations teams spot critical wallet movement,</tspan>
    <tspan x="64" dy="28">alert drift, and contract failures fast enough to respond calmly.</tspan>
  </text>

  <g>
    <rect x="64" y="566" width="176" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.76" stroke="#FFFFFF" stroke-opacity="0.92"/>
    <text x="88" y="592" class="badge">Treasury movement</text>
    <rect x="252" y="566" width="172" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.76" stroke="#FFFFFF" stroke-opacity="0.92"/>
    <text x="276" y="592" class="badge">Deploy failures</text>
    <rect x="64" y="622" width="156" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.76" stroke="#FFFFFF" stroke-opacity="0.92"/>
    <text x="88" y="648" class="badge">Contract events</text>
  </g>

  <g>
    <g opacity="0">
      <image href="/media/personas/protocol-operations-overview.png" x="620" y="90" width="580" height="430" preserveAspectRatio="xMidYMin slice" clip-path="url(#clipMain)"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.25;0.33;1" dur="12s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <image href="/media/features/alert-creation-flow.png" x="620" y="90" width="580" height="430" preserveAspectRatio="xMidYMin slice" clip-path="url(#clipMain)"/>
      <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.32;0.33;0.41;0.58;0.66;1" dur="12s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <image href="/media/home/alerts-response.png" x="620" y="90" width="580" height="430" preserveAspectRatio="xMidYMin slice" clip-path="url(#clipMain)"/>
      <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.66;0.67;0.75;0.92;1" dur="12s" repeatCount="indefinite"/>
    </g>

    <rect x="620" y="90" width="580" height="430" rx="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.85"/>
  </g>

  <g opacity="0">
    <rect x="620" y="538" width="580" height="104" rx="28" fill="#FFFFFF" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.9"/>
    <text x="646" y="570" class="caption-label">OVERVIEW</text>
    <text x="646" y="606" class="caption-text">See the wallets, alerts, and workflow state that matter from one operating view.</text>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.25;0.33;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <rect x="620" y="538" width="580" height="104" rx="28" fill="#FFFFFF" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.9"/>
    <text x="646" y="570" class="caption-label">SETUP</text>
    <text x="646" y="606" class="caption-text">Create a live alert in minutes instead of rebuilding logic every time a new risk appears.</text>
    <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.32;0.33;0.41;0.58;0.66;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <rect x="620" y="538" width="580" height="104" rx="28" fill="#FFFFFF" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.9"/>
    <text x="646" y="570" class="caption-label">RESPONSE</text>
    <text x="646" y="606" class="caption-text">Route signal with enough context that your team can act before users feel the impact.</text>
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.66;0.67;0.75;0.92;1" dur="12s" repeatCount="indefinite"/>
  </g>
</svg>
