<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="512" viewBox="0 0 1536 512">
  <!-- Ekko horizontal logo, single colour: Deep Slate Olive for light surfaces (Wada No. 321, 2026-10-03) -->
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -10px;
      }
    </style>
  </defs>
  <g transform="translate(256, 256)">
    <circle r="48" fill="#253122" />
    <circle r="96" fill="none" stroke="#253122" stroke-width="24" stroke-opacity="0.88" />
    <circle r="152" fill="none" stroke="#253122" stroke-width="20" stroke-opacity="0.68" stroke-dasharray="200 100" transform="rotate(-45)" />
    <circle r="208" fill="none" stroke="#253122" stroke-width="16" stroke-opacity="0.48" stroke-dasharray="300 150" transform="rotate(45)" />
  </g>
  <text x="550" y="340" font-size="280" fill="#253122">Ekko</text>
</svg>
