<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Ekko wallet platform motion reel</title>
  <desc id="desc">Animated product reel showing wallet platform activity, trigger setup, and routed delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F7FF"/>
      <stop offset="100%" stop-color="#EDF2FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F7CFF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="22" dy="22" stdDeviation="20" flood-color="#94A3B8" flood-opacity="0.18"/>
      <feDropShadow dx="-12" dy="-12" stdDeviation="16" flood-color="#FFFFFF" flood-opacity="0.92"/>
    </filter>
    <clipPath id="clipMain">
      <rect x="620" y="90" width="580" height="430" rx="34"/>
    </clipPath>
    <style>
      .eyebrow { font: 700 14px 'Manrope', Arial, sans-serif; fill: #475569; }
      .title { font: 800 58px 'Manrope', Arial, sans-serif; fill: #0F172A; letter-spacing: -2.5px; }
      .subtitle { font: 500 18px 'Manrope', Arial, sans-serif; fill: #475569; }
      .caption-label { font: 800 12px 'Manrope', Arial, sans-serif; fill: #64748B; letter-spacing: 2px; }
      .caption-text { font: 700 20px 'Manrope', Arial, sans-serif; fill: #0F172A; }
      .badge { font: 700 14px 'Manrope', Arial, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="24" y="24" width="1232" height="672" rx="40" fill="#F9FBFF" fill-opacity="0.84" stroke="#FFFFFF" stroke-opacity="0.8" filter="url(#shadow)"/>
  <rect x="64" y="56" width="238" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.82" stroke="#FFFFFF" stroke-opacity="0.92"/>
  <circle cx="86" cy="76" r="6" fill="url(#accent)"/>
  <text x="102" y="81" class="eyebrow">Wallet platforms</text>
  <text x="64" y="160" class="title">
    <tspan x="64" dy="0">Keep customer activity</tspan>
    <tspan x="64" dy="60" fill="url(#accent)">inside your own</tspan>
    <tspan x="64" dy="60" fill="url(#accent)">workflow.</tspan>
  </text>
  <text x="64" y="324" class="subtitle">
    <tspan x="64" dy="0">Follow wallet events at scale and push them into support, product,</tspan>
    <tspan x="64" dy="28">or ops systems without building the whole monitoring pipeline yourself.</tspan>
  </text>
  <g>
    <rect x="64" y="566" width="214" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.76" stroke="#FFFFFF" stroke-opacity="0.92"/>
    <text x="88" y="592" class="badge">Customer wallet tracking</text>
    <rect x="292" y="566" width="154" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.76" stroke="#FFFFFF" stroke-opacity="0.92"/>
    <text x="316" y="592" class="badge">Webhook delivery</text>
    <rect x="64" y="622" width="210" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.76" stroke="#FFFFFF" stroke-opacity="0.92"/>
    <text x="88" y="648" class="badge">Faster support response</text>
  </g>
  <g>
    <g opacity="0">
      <image href="/media/personas/wallet-platforms-activity.png" x="620" y="90" width="580" height="430" preserveAspectRatio="xMidYMin slice" clip-path="url(#clipMain)"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.25;0.33;1" dur="12s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <image href="/media/features/wallet-trigger-builder.png" x="620" y="90" width="580" height="430" preserveAspectRatio="xMidYMin slice" clip-path="url(#clipMain)"/>
      <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.32;0.33;0.41;0.58;0.66;1" dur="12s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <image href="/media/home/alerts-response.png" x="620" y="90" width="580" height="430" preserveAspectRatio="xMidYMin slice" clip-path="url(#clipMain)"/>
      <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.66;0.67;0.75;0.92;1" dur="12s" repeatCount="indefinite"/>
    </g>
    <rect x="620" y="90" width="580" height="430" rx="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.85"/>
  </g>
  <g opacity="0">
    <rect x="620" y="538" width="580" height="104" rx="28" fill="#FFFFFF" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.9"/>
    <text x="646" y="570" class="caption-label">ACTIVITY</text>
    <text x="646" y="606" class="caption-text">Track wallet movement from one view instead of stitching signals together manually.</text>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.25;0.33;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <rect x="620" y="538" width="580" height="104" rx="28" fill="#FFFFFF" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.9"/>
    <text x="646" y="570" class="caption-label">RULES</text>
    <text x="646" y="606" class="caption-text">Set up the wallet conditions that matter to your users without a long implementation loop.</text>
    <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.32;0.33;0.41;0.58;0.66;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <rect x="620" y="538" width="580" height="104" rx="28" fill="#FFFFFF" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.9"/>
    <text x="646" y="570" class="caption-label">DELIVERY</text>
    <text x="646" y="606" class="caption-text">Push signal into the systems your team already owns so support and product can respond faster.</text>
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.66;0.67;0.75;0.92;1" dur="12s" repeatCount="indefinite"/>
  </g>
</svg>
